<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="8"/>
  <g transform="translate(96, 96)" filter="url(#glow)">
    <rect x="20" y="40" width="280" height="90" rx="16" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="12"/>
    <circle cx="70" cy="85" r="14" fill="#10b981"/>
    <circle cx="115" cy="85" r="14" fill="#00f0ff"/>
    <line x1="170" y1="85" x2="260" y2="85" stroke="#00f0ff" stroke-width="10" stroke-linecap="round"/>
    
    <rect x="20" y="190" width="280" height="90" rx="16" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="12"/>
    <circle cx="70" cy="235" r="14" fill="#10b981"/>
    <circle cx="115" cy="235" r="14" fill="#00f0ff"/>
    <line x1="170" y1="235" x2="260" y2="235" stroke="#00f0ff" stroke-width="10" stroke-linecap="round"/>

    <path d="M160 130 L160 190" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
